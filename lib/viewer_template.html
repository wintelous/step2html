<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>__TITLE__</title>
<script>
  // pick the theme before first paint: saved choice, else the OS preference
  (function(){ var t=null; try{ t=localStorage.getItem('step2html-theme'); }catch(e){}
    if(t!=='light' && t!=='dark') t=(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
    document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
  :root, :root[data-theme="dark"] {
    --bg-1: #646b75; --bg-2: #474d56;              /* viewport gradient (center -> edge) */
    --surface: rgba(44,48,55,.86); --surface-solid: #2f343b;
    --surface-2: rgba(255,255,255,.055); --hover: rgba(255,255,255,.07);
    --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.16);
    --text: #e4e7eb; --text-2: #a3a9b2; --text-3: #7c838d;
    --accent: #5b93f5; --accent-soft: rgba(91,147,245,.24); --accent-text: #ffffff;
    --danger: #ff9b8f;
    --shadow: 0 8px 28px rgba(0,0,0,.32), 0 1px 3px rgba(0,0,0,.22);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg-1: #e3e6e9; --bg-2: #c5cad1;
    --surface: rgba(238,240,242,.88); --surface-solid: #eef0f2;
    --surface-2: rgba(20,30,45,.05); --hover: rgba(20,30,45,.06);
    --border: rgba(20,30,45,.10); --border-strong: rgba(20,30,45,.17);
    --text: #262b33; --text-2: #5b636e; --text-3: #8a919b;
    --accent: #3a74db; --accent-soft: rgba(58,116,219,.16); --accent-text: #ffffff;
    --danger: #c4483a;
    --shadow: 0 8px 26px rgba(30,40,55,.14), 0 1px 3px rgba(30,40,55,.10);
    color-scheme: light;
  }
  :root { --panel-w: 300px; --gap: 12px; --radius: 12px; }

  html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
  body { background: var(--bg-2); color: var(--text);
         font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         -webkit-text-size-adjust: 100%; touch-action: none; -webkit-tap-highlight-color: transparent;
         -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  input { user-select: text; -webkit-user-select: text; }
  button { font: inherit; color: inherit; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
          stroke-linecap: round; stroke-linejoin: round; }

  #viewer { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, var(--bg-1) 0%, var(--bg-2) 78%);
            transition: background .25s; }
  #viewer canvas { display: block; outline: none; }

  /* ---------- glass surfaces ---------- */
  .glass { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
           -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); }

  /* ---------- parts panel ---------- */
  #panel { position: absolute; top: var(--gap); left: var(--gap); bottom: var(--gap); width: var(--panel-w);
    border-radius: var(--radius); display: flex; flex-direction: column; z-index: 20; overflow: hidden;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .2s; }
  #panel.closed { transform: translateX(calc(-100% - 2 * var(--gap))); opacity: 0; pointer-events: none; }
  #panel-head { padding: 12px 10px 10px 14px; display: flex; align-items: flex-start; gap: 8px; }
  #panel-head .titles { flex: 1; min-width: 0; }
  #panel-head .title { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel-head .sub { color: var(--text-3); font-size: 12px; margin-top: 2px; }
  .icon-btn { background: transparent; border: 0; border-radius: 8px; width: 30px; height: 30px; display: grid;
              place-items: center; color: var(--text-2); cursor: pointer; flex: none; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  .search { position: relative; margin: 0 10px 8px; }
  .search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
  #filter { width: 100%; box-sizing: border-box; padding: 8px 10px 8px 32px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; outline: none;
            transition: border-color .15s, box-shadow .15s; }
  #filter::placeholder { color: var(--text-3); }
  #filter:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .scroller { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 6px 10px; -webkit-overflow-scrolling: touch;
              border-top: 1px solid var(--border); scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .scroller::-webkit-scrollbar { width: 8px; }
  .scroller::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
  #results { display: none; }
  .note { color: var(--text-3); font-size: 12px; padding: 10px 8px; }

  .row { display: flex; align-items: center; height: 28px; margin-top: 1px; padding-right: 4px; border-radius: 6px;
         user-select: none; -webkit-user-select: none; white-space: nowrap; color: var(--text); }
  .row:hover { background: var(--hover); }
  .row.selected { background: var(--accent-soft); }
  .row.selected .label { color: var(--text); font-weight: 500; }
  .row.hidden-part .label, .row.hidden-part .swatch { opacity: .42; }
  .row.transp-part .swatch { background-color: transparent !important; border-style: dashed; }
  .twisty { width: 18px; height: 100%; display: grid; place-items: center; color: var(--text-3); cursor: pointer; flex: none; }
  .twisty svg { width: 12px; height: 12px; transition: transform .15s; }
  .twisty.open svg { transform: rotate(90deg); }
  .twisty.leaf { visibility: hidden; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; flex: none;
            border: 1px solid var(--border-strong); box-sizing: border-box; }
  .label { flex: 1; overflow: hidden; text-overflow: ellipsis; cursor: pointer; padding: 6px 0; }
  .eye { width: 26px; height: 24px; display: grid; place-items: center; cursor: pointer; flex: none; border-radius: 5px;
         color: var(--text-3); opacity: 0; transition: opacity .12s; }
  .eye svg { width: 15px; height: 15px; }
  .row:hover .eye, .row.hidden-part .eye, .row.selected .eye { opacity: 1; }
  .eye:hover { color: var(--text); background: var(--hover); }
  @media (hover: none) { .eye { opacity: 1; } }

  /* ---------- toolbar ---------- */
  #panel-toggle { position: absolute; top: var(--gap); left: var(--gap); z-index: 25; display: none; }
  #panel.closed ~ #panel-toggle { display: flex; }
  #toolbar { position: absolute; right: var(--gap); top: var(--gap); display: flex; align-items: center; gap: 2px;
             padding: 4px; border-radius: 12px; z-index: 15; }
  .tbtn { display: flex; align-items: center; gap: 6px; background: transparent; border: 0; border-radius: 8px;
          padding: 7px 10px; color: var(--text-2); cursor: pointer; white-space: nowrap; transition: background .12s, color .12s; }
  .tbtn:hover { background: var(--hover); color: var(--text); }
  .tbtn.active { background: var(--accent-soft); color: var(--accent); }
  .tbtn:disabled { opacity: .4; cursor: default; background: transparent; color: var(--text-2); }
  .tsep { width: 1px; height: 18px; background: var(--border-strong); margin: 0 3px; }
  #panel-toggle.tbtn { padding: 8px 12px; border-radius: 10px; color: var(--text); }
  #theme-btn .moon { display: none; }
  :root[data-theme="light"] #theme-btn .sun { display: none; }
  :root[data-theme="light"] #theme-btn .moon { display: block; }

  /* ---------- context menu ---------- */
  #ctx { position: fixed; z-index: 50; min-width: 210px; max-width: 280px; padding: 5px; border-radius: 10px;
         display: none; background: var(--surface-solid); opacity: 0; transform: scale(.97); transform-origin: top left;
         transition: opacity .1s, transform .1s; }
  #ctx.open { display: block; }
  #ctx.shown { opacity: 1; transform: none; }
  #ctx .ctx-title { padding: 6px 9px 7px; font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis;
                    white-space: nowrap; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  #ctx .ctx-sep { height: 1px; background: var(--border); margin: 4px 2px; }
  #ctx button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent;
                border: 0; border-radius: 6px; padding: 7px 9px; cursor: pointer; color: var(--text); }
  #ctx button svg { color: var(--text-2); }
  #ctx button:hover, #ctx button:focus-visible { background: var(--accent); color: var(--accent-text); outline: none; }
  #ctx button:hover svg, #ctx button:focus-visible svg { color: var(--accent-text); }
  #ctx button:disabled { opacity: .4; pointer-events: none; }
  #ctx kbd { margin-left: auto; padding-left: 16px; font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-3); }
  #ctx button:hover kbd { color: var(--accent-text); opacity: .8; }
  @media (hover: none) { #ctx kbd { display: none; } }

  /* ---------- misc ---------- */
  #hud { position: absolute; left: 50%; bottom: var(--gap); transform: translateX(-50%); padding: 6px 12px; border-radius: 999px;
         color: var(--text-2); font-size: 12px; pointer-events: none; user-select: none; white-space: nowrap;
         transition: opacity .6s; z-index: 10; }
  #hud.faded { opacity: 0; }
  #spinner { position: absolute; inset: 0; display: grid; place-items: center; z-index: 30; color: var(--text-2); }
  #spinner .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #spinner .ring { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--border-strong);
                   border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #err { position: absolute; inset: 0; display: none; place-items: center; color: var(--danger);
         text-align: center; padding: 24px; box-sizing: border-box; z-index: 30; }

  @media (max-width: 720px) {
    :root { --panel-w: min(86vw, 360px); --gap: 8px; }
    .row { height: 40px; } .label { padding: 11px 0; }
    .eye { width: 38px; height: 36px; } .eye svg { width: 18px; height: 18px; }
    .twisty { width: 28px; } .twisty svg { width: 14px; height: 14px; }
    .tbtn { padding: 10px; } .tbtn .lbl { display: none; }
    #toolbar { gap: 0; }
    #ctx button { padding: 11px 10px; font-size: 14px; }
    #hud { display: none; }
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>

      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>

  </svg>

  <div id="viewer"></div>

  <div id="panel" class="glass">
    <div id="panel-head">
      <div class="titles"><div class="title">__TITLE__</div><div class="sub" id="part-count">&nbsp;</div></div>
      <button id="btn-close" class="icon-btn" title="Hide panel"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="search"><svg class="i"><use href="#i-search"/></svg>
      <input id="filter" type="text" placeholder="Filter parts" autocomplete="off" spellcheck="false" /></div>
    <div id="tree" class="scroller"></div>
    <div id="results" class="scroller"></div>
  </div>
  <button id="panel-toggle" class="tbtn glass" title="Show parts"><svg class="i"><use href="#i-menu"/></svg><span>Parts</span></button>

  <div id="toolbar" class="glass">
    <button id="btn-fit" class="tbtn" title="Fit to view (F)"><svg class="i"><use href="#i-fit"/></svg><span class="lbl">Fit</span></button>
    <button id="btn-isolate" class="tbtn" title="Show only the selected part (I)" disabled><svg class="i"><use href="#i-isolate"/></svg><span class="lbl">Isolate</span></button>
    <button id="btn-showall" class="tbtn" title="Show all parts (A)"><svg class="i"><use href="#i-showall"/></svg><span class="lbl">Show all</span></button>

<script>__THREE_JS__</script>
<script>__ORBITCONTROLS_JS__</script>
<script>__GLTFLOADER_JS__</script>
<script>
var MODEL_B64 = "__MODEL_B64__";
var NAME_MAP = __NAME_MAP__;  // { glTF-node-name (NAUO id) : real part name }

(function () {
  function $(id){ return document.getElementById(id); }
  function fail(msg){ var e=$('err'); e.style.display='grid'; e.textContent='Could not display model: '+msg;
                      var s=$('spinner'); if(s) s.style.display='none'; }
  function b64ToArrayBuffer(b64){ var bin=atob(b64),len=bin.length,bytes=new Uint8Array(len);
    for(var i=0;i<len;i++) bytes[i]=bin.charCodeAt(i); return bytes.buffer; }
  function icon(id){ return '<svg class="i"><use href="#i-'+id+'"/></svg>'; }

  if (typeof THREE === 'undefined') { fail('three.js failed to load'); return; }

  var container=$('viewer');

  var renderer=new THREE.WebGLRenderer({antialias:true, alpha:true});   // transparent: CSS gradient shows through
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding=THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.01, 1e6);
  var controls=new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.08;

  scene.add(new THREE.HemisphereLight(0xffffff,0x484850,0.95));
  var kl=new THREE.DirectionalLight(0xffffff,0.65); kl.position.set(1,1.3,1); scene.add(kl);
  var fl=new THREE.DirectionalLight(0xffffff,0.35); fl.position.set(-1,-0.6,-1); scene.add(fl);

  var root=null, selected=null, edgesBuilt=false, edgesOn=false, needsRender=true;
  var HILITE=new THREE.Color(0x2f7bff), TRANSP_OPACITY=0.22;
  var treeEl=$('tree'), resultsEl=$('results');
  var flatIndex=[];                 // {node, lname} for the filter, built once (no DOM)
  var resultRecs=[];                // rows currently shown in the filter results

  function invalidate(){ needsRender=true; }
  controls.addEventListener('change', invalidate);

  // ---------- theme ----------
  function setTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('step2html-theme', t); }catch(e){}
  }
  $('theme-btn').onclick=function(){
    setTheme(document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light');
  };

  // ---------- camera fit ----------
  function fitTo(obj){
    obj=obj||root; if(!obj) return;
    var box=new THREE.Box3().setFromObject(obj); if(box.isEmpty()) return;
    var size=new THREE.Vector3(), c=new THREE.Vector3(); box.getSize(size); box.getCenter(c);
    var maxDim=Math.max(size.x,size.y,size.z)||1;
    var tanV=Math.tan(Math.PI*camera.fov/360), tanMin=Math.min(tanV, tanV*camera.aspect);   // portrait: width limits
    var dist=(maxDim/(2*tanMin))*(camera.aspect<1?1.35:1.7);
    var dir=new THREE.Vector3(1,0.7,1).normalize();
    camera.position.copy(c.clone().add(dir.multiplyScalar(dist)));
    var all=root?new THREE.Box3().setFromObject(root):box, allSize=new THREE.Vector3(); all.getSize(allSize);
    var span=Math.max(allSize.x,allSize.y,allSize.z,maxDim)||1;
    camera.near=maxDim/1000; camera.far=span*1000; camera.updateProjectionMatrix();
    controls.target.copy(c); controls.update(); invalidate();
  }

  // ---------- highlight ----------
  function setHighlight(node,on){
    if(!node) return;
    node.traverse(function(o){
      if(o.isMesh && o.material && o.material.emissive){
        if(on){ if(o.userData._emis===undefined) o.userData._emis=o.material.emissive.getHex();
                o.material.emissive.copy(HILITE); o.material.emissiveIntensity=0.5; }
        else if(o.userData._emis!==undefined){ o.material.emissive.setHex(o.userData._emis); o.material.emissiveIntensity=1; }
      }
    });
    invalidate();
  }
  function select(node){
    if(selected===node) return;
    if(selected) setHighlight(selected,false);
    selected=node;
    if(selected) setHighlight(selected,true);
    $('btn-isolate').disabled=!selected;
    var prev=document.querySelectorAll('.row.selected'); for(var i=0;i<prev.length;i++) prev[i].classList.remove('selected');
    resultRecs.forEach(function(r){ if(r.node===node) r.row.classList.add('selected'); });
    if(node){ reveal(node); var rec=node.userData._rec;
              if(rec){ rec.row.classList.add('selected'); if(treeEl.style.display!=='none') rec.row.scrollIntoView({block:'nearest'}); } }
  }

  // ---------- visibility / transparency ----------
  function isTransparent(node){        // true when every mesh under node is see-through
    var any=false, all=true;
    node.traverse(function(o){ if(o.isMesh && !(o.userData&&o.userData._edge)){ any=true; if(!o.userData._transp) all=false; } });
    return any && all;
  }
  function anyTransparent(){
    var r=false; if(root) root.traverse(function(o){ if(o.isMesh && o.userData._transp) r=true; }); return r;
  }
  function setTransparent(node,on){
    node.traverse(function(o){
      if(!o.isMesh || !o.material || (o.userData&&o.userData._edge)) return;
      var m=o.material; o.userData._transp=on;
      m.transparent=on; m.opacity=on?TRANSP_OPACITY:1; m.depthWrite=!on; m.needsUpdate=true;
    });
    refreshIcons(); invalidate();
  }
  function syncRow(rec){
    var n=rec.node;
    rec.eye.innerHTML=icon(n.visible?'eye':'eye-off');
    rec.eye.title=n.visible?'Hide':'Show';
    rec.row.classList.toggle('hidden-part', !n.visible);
    rec.row.classList.toggle('transp-part', isTransparent(n));
  }
  function setVisible(node,vis){
    node.visible=vis; refreshIcons(); invalidate();
  }
  function refreshIcons(){          // sync every already-built row to its node's state
    if(!root) return;
    root.traverse(function(o){ var rec=o.userData && o.userData._rec; if(rec) syncRow(rec); });
    resultRecs.forEach(syncRow);
  }
  function showAll(){ if(root) root.traverse(function(o){ if(o!==root && !(o.userData&&o.userData._edge)) o.visible=true; });
                      if(edgesBuilt) setEdgesVisible(edgesOn);
                      refreshIcons(); invalidate(); }
  function isolate(node){
    node=node||selected; if(!node||!root) return;
    root.traverse(function(o){ if(o!==root && !(o.userData&&o.userData._edge)) o.visible=false; });
    var p=node; while(p && p!==root){ p.visible=true; p=p.parent; }
    node.traverse(function(o){ if(!(o.userData&&o.userData._edge)) o.visible=true; });
    refreshIcons(); fitTo(node); invalidate();
  }
  function shownInScene(o){ while(o){ if(!o.visible) return false; o=o.parent; } return true; }

  // ---------- edges (lazy) ----------
  function buildEdges(){
    if(edgesBuilt||!root) return; edgesBuilt=true;
    var meshes=[]; root.traverse(function(o){ if(o.isMesh && o.geometry) meshes.push(o); });
    meshes.forEach(function(o){ try{
      var eg=new THREE.EdgesGeometry(o.geometry,30);
      var ln=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x161a20}));
      ln.userData._edge=true; ln.visible=edgesOn; ln.matrixAutoUpdate=false; ln.raycast=function(){};
      o.add(ln); ln.updateMatrix(); ln.updateMatrixWorld(true);
    }catch(e){} });
  }
  function setEdgesVisible(on){ root.traverse(function(o){ if(o.userData && o.userData._edge) o.visible=on; }); }
  function toggleEdges(){
    if(!root) return;
    edgesOn=!edgesOn; buildEdges(); setEdgesVisible(edgesOn);
    $('btn-edges').classList.toggle('active', edgesOn); invalidate();
  }

  // ---------- tree (lazy) ----------
  function labelFor(o){
    if(o.name && NAME_MAP[o.name]) return NAME_MAP[o.name];
    if(o.name && o.name.trim()) return o.name.trim();
    return o.isMesh ? 'Solid' : 'Group';
  }
  function childNodesOf(o){
    var out=[]; for(var i=0;i<o.children.length;i++){ var c=o.children[i];
      if(c.userData && c.userData._edge) continue; out.push(c); } return out;
  }
  function rowFor(node, depth, kids){
    var row=document.createElement('div'); row.className='row'; row.style.paddingLeft=(2+depth*14)+'px';
    var tw=document.createElement('span'); tw.className='twisty'+(kids&&kids.length?'':' leaf'); tw.innerHTML=icon('chev');
    var lab=document.createElement('span'); lab.className='label';
    var text=labelFor(node); lab.textContent=text; lab.title=text;
    var eye=document.createElement('span'); eye.className='eye';
    row.appendChild(tw);
    if(node.isMesh && node.material && node.material.color){
      var sw=document.createElement('span'); sw.className='swatch';
      sw.style.background='#'+node.material.color.getHexString(); sw.style.borderColor='#'+node.material.color.getHexString();
      row.appendChild(sw);
    }
    row.appendChild(lab); row.appendChild(eye);
    var rec={node:node, row:row, eye:eye, twisty:tw};
    syncRow(rec);
    eye.addEventListener('click', function(e){ e.stopPropagation(); setVisible(node, !node.visible); });
    lab.addEventListener('click', function(e){ e.stopPropagation(); if(suppressClick()) return; select(selected===node ? null : node); });
    lab.addEventListener('dblclick', function(e){ e.stopPropagation(); select(node); fitTo(node); });
    row.addEventListener('contextmenu', function(e){ e.preventDefault(); select(node); openMenu(node, e.clientX, e.clientY); });
    attachLongPress(row, function(x,y){ select(node); openMenu(node, x, y, true); });
    return rec;
  }
  function makeRow(node, depth){
    var kids=childNodesOf(node);
    var rec=rowFor(node, depth, kids);
    var wrap=document.createElement('div'); wrap.appendChild(rec.row);
    rec.open=false; rec.built=false; rec.kidWrap=null;
    rec.setOpen=function(o){
      if(!kids.length) return; rec.open=o; rec.twisty.classList.toggle('open', o);
      if(o && !rec.built){
        rec.built=true; rec.kidWrap=document.createElement('div');
        var frag=document.createDocumentFragment();
        for(var i=0;i<kids.length;i++) frag.appendChild(makeRow(kids[i], depth+1));
        rec.kidWrap.appendChild(frag); wrap.appendChild(rec.kidWrap);
      }
      if(rec.kidWrap) rec.kidWrap.style.display=o?'':'none';
    };
    node.userData._rec=rec;
    rec.twisty.addEventListener('click', function(e){ e.stopPropagation(); rec.setOpen(!rec.open); });
    return wrap;
  }
  function reveal(node){            // build+open ancestors top-down so the row exists & is visible
    var chain=[], p=node.parent;
    while(p && p!==root){ chain.unshift(p); p=p.parent; }
    chain.forEach(function(a){ var rec=a.userData._rec; if(rec) rec.setOpen(true); });
  }
  function nearestPart(mesh){
    var p=mesh; while(p && p!==root){ if(p.name && NAME_MAP[p.name]) return p; p=p.parent; } return mesh;
  }

  // ---------- filter (flat results, capped) ----------
  var FILTER_CAP=1500;
  $('filter').addEventListener('input', function(){
    var q=this.value.trim().toLowerCase();
    resultRecs=[];
    if(!q){ resultsEl.style.display='none'; treeEl.style.display=''; resultsEl.innerHTML=''; return; }
    treeEl.style.display='none'; resultsEl.style.display='block'; resultsEl.innerHTML='';
    var n=0, frag=document.createDocumentFragment();
    for(var i=0;i<flatIndex.length && n<FILTER_CAP;i++){
      if(flatIndex[i].lname.indexOf(q)>=0){
        var node=flatIndex[i].node;
        var rec=rowFor(node, 0, null);
        if(node===selected) rec.row.classList.add('selected');
        resultRecs.push(rec); frag.appendChild(rec.row); n++;
      }
    }
    if(n===0){ var d=document.createElement('div'); d.className='note'; d.textContent='No parts match.'; frag.appendChild(d); }
    else if(n>=FILTER_CAP){ var d2=document.createElement('div'); d2.className='note'; d2.textContent='Showing first '+FILTER_CAP+' matches; refine the filter.'; frag.appendChild(d2); }
    resultsEl.appendChild(frag);
  });

  // ---------- long press (touch) ----------
  var lastLongPress=0;
  function suppressClick(){ return Date.now()-lastLongPress < 600; }
  function attachLongPress(el, cb){
    var t=null, sx=0, sy=0, pid=null;
    function cancel(){ if(t){ clearTimeout(t); t=null; } }
    el.addEventListener('pointerdown', function(e){
      if(e.pointerType==='mouse') return;
      if(t){ cancel(); return; }                   // second finger -> it's a pinch, not a press
      sx=e.clientX; sy=e.clientY; pid=e.pointerId;
      t=setTimeout(function(){ t=null; lastLongPress=Date.now(); if(navigator.vibrate) try{ navigator.vibrate(12); }catch(_){}
                               cb(sx, sy); }, 500);
    });
    el.addEventListener('pointermove', function(e){
      if(t && e.pointerId===pid && (Math.abs(e.clientX-sx)>8 || Math.abs(e.clientY-sy)>8)) cancel();
    });
    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointercancel', cancel);
  }

  // ---------- context menu ----------
  var ctx=$('ctx'), menuOpenedAt=0;
  function closeMenu(){ ctx.classList.remove('open','shown'); }
  function openMenu(node, x, y, touch){
    var items=[];
    if(node){
      var tr=isTransparent(node);
      items.push({title:labelFor(node)});
      items.push({icon:'eye-off', label:'Hide', key:'H', run:function(){ setVisible(node,false); if(selected===node) select(null); }});
      items.push(tr ? {icon:'solid',  label:'Make solid',       key:'T', run:function(){ setTransparent(node,false); }}
                    : {icon:'transp', label:'Make transparent', key:'T', run:function(){ setTransparent(node,true); }});
      items.push({icon:'isolate', label:'Hide others', key:'I', run:function(){ isolate(node); }});
      items.push({icon:'fit', label:'Zoom to part', key:'F', run:function(){ fitTo(node); }});
      items.push({sep:true});
    }
    items.push({icon:'showall', label:'Show all', key:'A', run:showAll});
    if(anyTransparent()) items.push({icon:'solid', label:'Make all solid', run:function(){ setTransparent(root,false); }});
    if(!node) items.push({icon:'fit', label:'Fit all', key:'F', run:function(){ fitTo(root); }});

    ctx.innerHTML='';
    items.forEach(function(it){
      if(it.title){ var t=document.createElement('div'); t.className='ctx-title'; t.textContent=it.title; t.title=it.title; ctx.appendChild(t); return; }
      if(it.sep){ var s=document.createElement('div'); s.className='ctx-sep'; ctx.appendChild(s); return; }
      var b=document.createElement('button'); b.setAttribute('role','menuitem');
      b.innerHTML=icon(it.icon)+'<span></span>'+(it.key?'<kbd>'+it.key+'</kbd>':'');
      b.querySelector('span').textContent=it.label;
      b.addEventListener('click', function(e){ e.stopPropagation(); if(Date.now()-menuOpenedAt<300) return;
                                               closeMenu(); it.run(); });
      ctx.appendChild(b);
    });

    ctx.classList.add('open'); ctx.classList.remove('shown');
    var w=ctx.offsetWidth, h=ctx.offsetHeight, vw=window.innerWidth, vh=window.innerHeight, pad=8;
    if(touch){ var fy=y; x-=w/2; y=fy-h-24; if(y<pad) y=fy+24; }   // above the finger, else below
    else { if(x+w>vw-pad) x-=w; if(y+h>vh-pad) y-=h; }
    x=Math.max(pad, Math.min(x, vw-w-pad)); y=Math.max(pad, Math.min(y, vh-h-pad));
    ctx.style.left=x+'px'; ctx.style.top=y+'px';
    menuOpenedAt=Date.now();
    requestAnimationFrame(function(){ ctx.classList.add('shown'); });
  }
  document.addEventListener('pointerdown', function(e){ if(!ctx.contains(e.target)) closeMenu(); }, true);
  document.addEventListener('wheel', closeMenu, {passive:true});
  window.addEventListener('blur', closeMenu);
  ctx.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // ---------- picking ----------
  var ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), down=null;
  function hitPart(x,y){            // first visible opaque part; transparent parts only if nothing else is hit
    if(!root) return null;
    var r=renderer.domElement.getBoundingClientRect();
    ndc.x=((x-r.left)/r.width)*2-1; ndc.y=-((y-r.top)/r.height)*2+1;
    ray.setFromCamera(ndc,camera);
    var hits=ray.intersectObject(root,true), firstTransp=null;
    for(var i=0;i<hits.length;i++){
      var o=hits[i].object;
      if(!o.isMesh || !shownInScene(o)) continue;
      if(o.userData._transp){ if(!firstTransp) firstTransp=o; continue; }
      return nearestPart(o);
    }
    return firstTransp ? nearestPart(firstTransp) : null;
  }
  var canvas=renderer.domElement;
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  canvas.addEventListener('pointerdown', function(e){
    down={x:e.clientX, y:e.clientY, t:Date.now(), menu:(e.button===2 || (e.button===0 && e.ctrlKey)), multi:!!down};
    fadeHud();
  });
  canvas.addEventListener('pointerup', function(e){
    if(!down) return; var d=down; down=null;
    if(d.multi || suppressClick()) return;
    var still=Math.abs(e.clientX-d.x)<6 && Math.abs(e.clientY-d.y)<6;
    if(!still) return;
    if(d.menu){ var p=hitPart(e.clientX,e.clientY); if(p) select(p); openMenu(p, e.clientX, e.clientY); return; }
    if(e.button===0 && (Date.now()-d.t)<400) select(hitPart(e.clientX,e.clientY));   // empty space clears selection
  });
  canvas.addEventListener('pointercancel', function(){ down=null; });
  attachLongPress(canvas, function(x,y){ down=null; var p=hitPart(x,y); if(p) select(p); openMenu(p, x, y, true); });

  // ---------- keyboard ----------
  document.addEventListener('keydown', function(e){
    if(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA')) {
      if(e.key==='Escape') e.target.blur(); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var k=e.key.toLowerCase();
    if(k==='escape'){ if(ctx.classList.contains('open')) closeMenu(); else select(null); return; }
    if(k==='f'){ fitTo(selected||root); }
    else if(k==='a'){ showAll(); }
    else if(k==='e'){ toggleEdges(); }
    else if(k==='i' && selected){ isolate(selected); }
    else if(k==='h' && selected){ var s=selected; setVisible(s,false); select(null); }
    else if(k==='t' && selected){ setTransparent(selected, !isTransparent(selected)); }
    else return;
    closeMenu(); e.preventDefault();
  });

  // ---------- hud ----------
  var hud=$('hud'), hudTimer=setTimeout(fadeHud, 9000);
  function fadeHud(){ clearTimeout(hudTimer); hud.classList.add('faded'); }

  // ---------- load ----------
  var loader=new THREE.GLTFLoader();
  try{
    loader.parse(b64ToArrayBuffer(MODEL_B64),'',function(gltf){
      root=gltf.scene;
      var nParts=0;
      root.traverse(function(o){
        if(o.isMesh && o.material){
          o.material=o.material.clone();
          o.material.side=THREE.DoubleSide;
          o.material.format=THREE.RGBAFormat;   // loader marks opaque glTF materials RGB -> shader forces alpha 1

          if(!o.material.color) o.material.color=new THREE.Color(0xcccccc);
          if(o.material.metalness!=null) o.material.metalness=Math.min(o.material.metalness,0.25);
          if(o.material.roughness==null) o.material.roughness=0.65;
        }
        if(o.name && NAME_MAP[o.name]) nParts++;
      });
      scene.add(root);
      fitTo(root);
      // freeze static transforms: the model never animates -> skip per-frame matrix updates
      root.updateMatrixWorld(true);
      root.traverse(function(o){ o.matrixAutoUpdate=false; });
      // build the flat search index (no DOM) and the top level of the tree (lazy below)
      var tops=childNodesOf(root);
      root.traverse(function(o){ if(o!==root && !(o.userData&&o.userData._edge)) flatIndex.push({node:o, lname:labelFor(o).toLowerCase()}); });
      var frag=document.createDocumentFragment();
      for(var i=0;i<tops.length;i++) frag.appendChild(makeRow(tops[i],0));
      treeEl.appendChild(frag);
      if(tops.length===1){ var r0=tops[0].userData._rec; if(r0) r0.setOpen(true); }   // single root assembly: show its contents
      $('part-count').textContent=(nParts||flatIndex.length)+' '+((nParts||flatIndex.length)===1?'part':'parts');
      var s=$('spinner'); if(s) s.style.display='none';
      invalidate();
    }, function(e){ fail((e&&e.message)?e.message:'parse error'); });
  }catch(e){ fail(e.message||String(e)); }

  // ---------- buttons ----------
  $('btn-fit').onclick=function(){ fitTo(selected||root); };
  $('btn-isolate').onclick=function(){ isolate(selected); };
  $('btn-showall').onclick=showAll;
  $('btn-edges').onclick=toggleEdges;
  $('btn-close').onclick=function(){ $('panel').classList.add('closed'); };
  $('panel-toggle').onclick=function(){ $('panel').classList.remove('closed'); };
  if(window.innerWidth<=720) $('panel').classList.add('closed');

  window.addEventListener('resize', function(){
    closeMenu();
    camera.aspect=container.clientWidth/container.clientHeight; camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight); invalidate();
  });
  // render only when something changed (saves battery; keeps 96k-object scenes smooth)
  (function animate(){ requestAnimationFrame(animate); controls.update();
    if(needsRender){ needsRender=false; renderer.render(scene,camera); } })();
})();
</script>
</body>
</html>
